</style></head><body><main>
<header><h1>Heartrow v6</h1><span id="goal" class="stat"></span></header>
<div class="stats" id="stats"></div>

<h2>Recruit row</h2><div class="cards row" id="row"></div>

<div class="msg" id="msg" title="Click for the full log" role="button" tabindex="0" aria-haspopup="dialog" aria-live="polite" aria-atomic="true"></div>

</main>
<script>

 if(r()<(type=='tide'?.75:.45)){
  const o=Object.keys(FX).filter(k=>FX[k].v<=b-(k[0]=='d'?1:0)&&!(foe&&NF.includes(k)));{const L=LEAN[type]||[],f=o.filter(k=>L.includes(k));const w=Math.max(1,Math.round(.7*(o.length-f.length)/(.3*Math.max(1,f.length))));for(let j=1;j<w;j++)o.push(...f);if(!foe)for(const k of EXTRA[type]||[])if(o.includes(k))o.push(k)}
  if(o.length){const k=o[r()*o.length|0];c.fx.push(k);if(k=='kin'||k=='army')c.km=r()<.5?main:(main=='gold'?'power':'gold');b-=FX[k].v;if(k=='bond'){let n=1+(r()*3|0);while(n>1&&[0,.7,1.5][n-1]>b)n--;c.bn=n;b-=[0,.7,1.5][n-1]}if(!foe&&CF.includes(k)&&b>=.5&&r()<.8){c.ret=1;b-=.5}}}

  const hc=c.hearts?.75:type=='tide'?.165:.075,q=r();

 {const sp=b0-b;c.cost=Math.max(foe?1:2,Math.min(cost,Math.ceil(foe?sp/HM:(sp-.3)/.85-1e-9)))}

const basic=(g,p)=>({id:++uid,type:'plain',kind:'basic',cost:0,gold:g,power:p,hearts:0,fx:[]});
function snap(){S.snap=null;S.snap=structuredClone(S)}

function say(m){S.log=m;S.hist.push('T'+S.turn+' · '+m)}
function newGame(lv){if(lv!==undefined)LV=lv;
 const deck=[];for(let i=0;i<10-SP;i++)deck.push(basic(1,0));for(let i=0;i<SP;i++)deck.push(basic(0,1));

 for(let i=0;i<5;i++)S.row.push(make(1));
 draw(5);render()}
function draw(n){S.snap=null;for(let i=0;i<n;i++){if(!S.deck.length){S.deck=shuf(S.discard);S.discard=[]}if(!S.deck.length)return;S.hand.push(S.deck.pop())}}

 if(fromPlay){had=S.types.has(c.type);if(c.type!='plain')S.types.add(c.type)}
 for(const k of c.fx){
  if(k=='draw1'){draw(1);say('Drew 1 card.')}if(k=='draw2'){draw(2);say('Drew 2 cards.')}
  if(k=='coin'){const g=Math.random()<.5?2:4;S.snap=null;S.gold+=g;say('Coin flip: +'+g+' ●.')}
  if(k=='exile'&&S.hand.length)S.pending=1;
  if(k=='cheap')S.disc++;if(k=='weak')S.edisc++;if(k=='army')S[c.km||m]+=[...S.deck,...S.hand,...S.discard].filter(x=>x.type==c.type).length/4|0;if(k=='reapG')S.rg++;if(k=='reapP')S.rp++;if(k=='swap'){const g=S.gold;S.gold=S.power;S.power=g;say('Swapped ● and ⚔.')}if(k=='cycle'||k=='purge'){const un=S.hand.filter(x=>!x.u&&x!==c&&(k=='purge'||!x.ret));S.hand=S.hand.filter(x=>!un.includes(x));draw(un.length);S.discard.push(...un);if(un.length)say('Cycled '+un.length+' cards.');else S.last='Nothing to discard.'}

  if(k=='all3'&&fromPlay&&S.types.size>=3)S.hearts+=2;
  if(k=='vault')S.hearts+=S.exile.length/3|0;
  if(k=='basics')S.gold+=[...S.deck,...S.hand,...S.discard].filter(x=>x.kind=='basic').length/4|0;
  if(k=='pile')S.power+=S.discard.length/3|0;
  if(k=='bond'&&had)S[m]+=c.bn||1;if(k=='kin'&&fromPlay)S[c.km||m]+=S.hand.filter(x=>x.u&&x!==c&&x.type==c.type).length}}
function play(i){
 if(S.over)return;const c=S.hand[i];
 if(S.pending){snap();S.hand.splice(i,1);S.exile.push(c);S.x++;S.pending=0;say('Exiled a '+NAME[c.type]+' card.');return render()}
 if(c.u){S.log='That card is already played this turn.';render();return shake(i,'#hand')}
 snap();c.u=1;S.last='';S.pl++;const g0=S.gold,p0=S.power,h0=S.hearts,i0=S.hist.length;apply(c,1);const dg=S.gold-g0,dp=S.power-p0,dh=S.hearts-h0,note=S.last;S.last='';const pm='Played a '+NAME[c.type]+' card'+(dg>0?' +'+dg+' ●':'')+(dp>0?' +'+dp+' ⚔':'')+(dh>0?' +'+dh+' ♥':'')+'.'+(note?' '+note:'');S.hist.splice(i0,0,'T'+S.turn+' · '+pm);if(S.hist.length==i0+1||note)S.log=pm;check();render()}
function skip(){S.pending=0;say('Skipped the exile.');render()}
function cost(c){return c.kind=='recruit'?Math.max(0,c.cost-S.disc):Math.max(0,c.cost-S.edisc)}

 if(S.over||S.pending)return;const c=S.row[i],rowEnemies=c.kind=='enemy'?S.row.filter(x=>x.kind=='enemy').length:0;

function autoplay(){if(S.over||S.pending)return;for(let i=S.hand.length-1;i>=0;i--)if(!S.hand[i].fx.length&&!S.hand[i].u)play(i)}

 if(S.over||S.pending)return;

 if(out.kind=='enemy'){S.hearts-=out.hearts;S.lost+=out.hearts;note='An enemy escaped: −'+out.hearts+' ♥. '}

 {const rh=S.rg*(S.gold/3|0)+S.rp*(S.power/2|0);if(rh){S.hearts+=rh;note+='Leftovers reaped: +'+rh+' ♥. '}}S.wg+=S.gold;S.wp+=S.power;S.rg=S.rp=0;S.gold=S.power=S.disc=S.edisc=0;S.types=new Set();if(S.hearts>=S.goal){S.over=1;return render()}

function check(){if(S.hearts>=S.goal&&!S.reached){S.reached=1;say('Goal reached! End your turn to win, or keep going for a bigger margin.')}}

function card(c,i,ctx){

 const ax=ctx=='hand'?(c.u?' aria-disabled="true"':'')+(S.pending?' aria-describedby="msg"':''):ctx=='row'&&!can(c)?' aria-disabled="true"':'';
 const lock=ctx=='row'&&i==4?'<span class="lock" role="img" title="This card stays when you redraw" aria-label="This card stays when you redraw"><svg viewBox="0 0 330 330" aria-hidden="true"><path fill="currentColor" d="M65 330h200c8.284 0 15-6.716 15-15V145c0-8.284-6.716-15-15-15h-15V85C250 38.131 211.869 0 165 0S80 38.131 80 85v45H65c-8.284 0-15 6.716-15 15v170c0 8.284 6.716 15 15 15zm115-95.014V255c0 8.284-6.716 15-15 15s-15-6.716-15-15v-20.014c-6.068-4.565-10-11.824-10-19.986 0-13.785 11.215-25 25-25s25 11.215 25 25c0 8.162-3.932 15.421-10 19.986zM110 85c0-30.327 24.673-55 55-55s55 24.673 55 55v45H110V85z"/></svg></span>':'';
 const al=spoken(`${ctx=='row'?(c.kind=='enemy'?'Enemy':'Recruit')+' ':''}${NAME[c.type]} card. ${ctx=='row'?(c.kind=='recruit'?'gold ●':'power ⚔')+' to '+(c.kind=='recruit'?'buy':'defeat')+'. ':''}${b.replace(/<[^>]+>/g,' ')}${c.u?' Already played this turn.':''}`);
 return`<button class="card ${c.type} ${c.kind=='enemy'?'enemy':''}${cls}" data-i="${i}"${ax} aria-label="${al}" title="${ctx=='row'?(c.kind=='enemy'?'Enemy: defeat it with power. You get its hearts and effects right away, once.':'Recruit: buy it with gold. It goes to your discard, and its gains and effects happen when you play it from your hand.'):''}"><div class="top">${L}<em>${NAME[c.type]}</em></div>${lock}${art(c)}<div class="bd">${b}</div></button>`}
function render(){
 $('#goal').innerHTML=`Goal: <span class="h">${S.goal} ♥</span> in ${S.max} turns`;
 const TIP={turn:'Turn number. The game ends after the last turn.',hearts:'Reach the goal to win. Enemies that fall off the right edge take hearts away, and hearts can go negative.',gold:'Spent on recruits. Resets every turn.',power:'Spent on defeating enemies. Resets every turn.',discount:'Recruits cost less gold ●, and enemies cost less power ⚔, this turn.',redraws:'Replace the four left cards of the recruit row. You gain one every 3 turns and they stack.','types played':'Moss, Ember and Tide cards played this turn. Some cards reward playing all three.'};
 const st=(l,v,c='',t='',lab='',bd='')=>`<div class="stat ${c}" title="${t||TIP[l]||''}"${l=='redraws'?' data-r="1" style="cursor:pointer"':''}>${v}<small>${lab||l}</small>${bd?`<span class="rb">${bd}</span>`:''}</div>`,pb=(n,l)=>`<button class="stat" data-p="${n}">${S[n].length}<small>${l}</small></button>`;
 $('#stats').innerHTML=st('turn',`${S.turn}<span class="den">/${S.max}</span>`)+st('hearts',`${S.hearts}<span class="den">/${S.goal}</span>`,'h')+st('gold',S.gold,'g big',S.rg?`Unspent gold turns into hearts at the end of the turn: 1 per 3 for each reaping card in play. Now: +${S.rg*(S.gold/3|0)} ♥.`:'','',hb(S.rg))+st('power',S.power,'p big',S.rp?`Unspent power turns into hearts at the end of the turn: 1 per 2 for each reaping card in play. Now: +${S.rp*(S.power/2|0)} ♥.`:'','',hb(S.rp))+st('discount',(S.disc?`<span class="g">−${S.disc}</span>`:'')+(S.disc&&S.edisc?' ':'')+(S.edisc?`<span class="p">−${S.edisc}</span>`:'')||'0','',[S.disc&&`Recruits cost ${S.disc} less gold ●.`,S.edisc&&`Enemies cost ${S.edisc} less power ⚔.`].filter(Boolean).join(' ')||'No discounts this turn. Some cards make recruits or enemies cheaper.')+st('redraws',S.mull)+st('types played','<span style="display:flex;gap:3px">'+['moss','ember','tide'].map(t=>`<span style="display:inline-block;width:14px;height:19px;border-radius:3px;background:var(${TG[t][1]});opacity:${S.types.has(t)?1:.2}"></span>`).join('')+'</span>')+`<button class="stat" data-p="1" title="Draw pile / discard / exile. Click to look inside.">${S.deck.length} / ${S.discard.length} / ${S.exile.length}<small>draw / discard / exile</small></button>`;
 $('#row').innerHTML=S.row.map((c,i)=>'<div class="slot">'+card(c,i,'row')+'</div>').join('');
 const hh=$('#hand'),n=S.hand.length;if(hh.style)hh.style.setProperty('--k',n>5?(n-5)/(n-1):0);hh.innerHTML=S.hand.map((c,i)=>'<div class="slot">'+card(c,i,'hand')+'</div>').join('');
 const sm=`Defeated ${S.k}, recruited ${S.b}, exiled ${S.x}, lost ${S.lost} ♥ to escapes. Wasted ${S.wg} ●, ${S.wp} ⚔; ${S.mull} redraws left.`;
 const m=$('#msg');m.className='msg'+(S.pending?' warn':'');
 const mt=S.over==1?`You won with ${S.hearts} ♥ on turn ${S.turn}. `+sm:S.over==2?`Out of turns: ${S.hearts}/${S.goal} ♥. `+sm:S.pending?'Exile: click any card in your hand, played or not, or skip.':S.log;m.innerHTML=paint(mt);m.setAttribute('aria-label',spoken(mt)+(S.pending?' Select a card to exile, or skip.':' Activate to open the full log.'));if(S.over&&!S.el){S.el=1;S.hist.push('T'+S.turn+' · '+mt)}
 $('#bar').innerHTML=`<button class="b" id="e" ${S.over||S.pending?'disabled':''}>End turn</button><button class="b alt" id="a" ${S.over||S.pending||!S.hand.some(c=>!c.fx.length&&!c.u)?'disabled':''} title="Plays every card without a worded effect.">Play simple (space)</button><button class="b alt" title="Replaces the four left cards of the recruit row; the right-edge card stays." id="m" ${S.mull<1?'disabled':''}>Redraw</button>${S.pending?'<button class="b alt" id="s">Skip exile</button>':''}<button class="b alt" id="u" ${S.snap?'':'disabled'} title="Undo your last card play or exile (only if nothing was drawn or flipped).">Undo</button><button class="b alt" id="n">New game</button><button class="b alt" id="about">About</button>`;
 $('#e').onclick=endTurn;$('#a').onclick=autoplay;$('#m').onclick=mulligan;$('#n').onclick=askNew;$('#u').onclick=undo;$('#about').onclick=showAbout;if(S.pending)$('#s').onclick=skip}
$('#row').onclick=e=>{const b=e.target.closest('.card');if(b)take(+b.dataset.i)};
$('#hand').onclick=e=>{const b=e.target.closest('.card');if(b)play(+b.dataset.i)};
$('#stats').onclick=e=>{if(e.target.closest('[data-r]'))return mulligan();if(!e.target.closest('[data-p]'))return;
 const O=['plain','moss','ember','tide','foe'],v=c=>c.gold+c.power+c.hearts*1.5+c.fx.length;
 $('#dlgC').innerHTML=deckSummary()+[['deck','Draw pile (sorted; order hidden)'],['discard','Discard'],['exile','Exile']].map(([n,t])=>`<h2>${t} · ${S[n].length}</h2><div class="cards mini">${S[n].slice().sort((a,b)=>O.indexOf(a.type)-O.indexOf(b.type)||v(b)-v(a)).map(c=>card(c,0,'pile')).join('')||'<span class="rules">Empty.</span>'}</div>`).join('');$('#dlg').showModal()};
function showAbout(){$('#dlgC').innerHTML='<h2>About Heartrow</h2><p>Click a hand card to play it, or a recruit row card to buy it. Recruits cost gold ●, go to your discard and work whenever you draw them. Enemies cost power ⚔: defeating one gives its hearts ♥ and effects once, and if one falls off the right edge you lose that many.</p><p>Costs in the recruit row rise as turns pass. Space plays all simple cards. Every card is generated as it appears, from about 8,500 possible recruits and 126 enemies. Moss leans gold and rewards a larger deck, Ember leans power and enemies, Tide leans draw, exile, and hearts.</p><p>Inspired by Dominion, Ascension, Gemblades and Star Realms.</p>';$('#dlg').showModal()}
function showLog(){$('#dlgC').innerHTML='<h2>Log (newest first)</h2><div style="max-height:60vh;overflow:auto">'+S.hist.slice().reverse().map(x=>'<div class="logline">'+paint(x)+'</div>').join('')+'</div>';$('#dlg').showModal()}
$('#msg').onclick=showLog;$('#msg').onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();showLog()}};
$('#dlg').onclick=e=>{const b=e.target.closest('[data-lv]');if(b){e.currentTarget.close();return newGame(+b.dataset.lv)}if(e.target===e.currentTarget)e.currentTarget.close()};
addEventListener('keydown',e=>{if(e.code=='Space'&&!e.target.closest('button')){e.preventDefault();autoplay()}});
function hb(n){return n?(n<4?'♥'.repeat(n):'♥×'+n):''}
function deckSummary(){const all=[...S.deck,...S.hand,...S.discard],t=k=>all.reduce((a,c)=>a+c[k],0),n=y=>all.filter(c=>c.type==y).length,e={g:0,p:0,h:0,u:0};for(const c of all)for(const k of c.fx)e[({coin:'g',basics:'g',foes:'p',pile:'p',all3:'h',vault:'h',reapG:'h',reapP:'h',bond:c.m=='power'?'p':'g',kin:c.km=='power'?'p':'g',army:c.km=='power'?'p':'g'})[k]||'u']++;return`<p style="margin:0 0 10px"><b>Your deck:</b> ${all.length} cards · plain gains <span class="g">${t('gold')} ●</span> <span class="p">${t('power')} ⚔</span> <span class="h">${t('hearts')} ♥</span> · effects <span class="g">${e.g} ●</span> <span class="p">${e.p} ⚔</span> <span class="h">${e.h} ♥</span> ${e.u} other · Moss ${n('moss')}, Ember ${n('ember')}, Tide ${n('tide')}, Basic ${n('plain')}</p>`}
function askNew(){$('#dlgC').innerHTML='<h2>New game: choose a level</h2><div style="display:flex;flex-direction:column;gap:8px">'+GOALS.map((g,i)=>`<button class="b alt" data-lv="${i}">Level ${i+1}: ${g} ♥ in ${TURNS} turns</button>`).join('')+'</div>';$('#dlg').showModal()}
function fit(){const a=($('main').clientWidth-48)/5,d=document.documentElement.style;d.setProperty('--z',a/118)}
if(typeof window!='undefined'){fit();addEventListener('resize',fit)}
newGame();
</script></body></html>
